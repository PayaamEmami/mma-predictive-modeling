name: Zip and Upload to S3

on:
  push:
    branches:
      - main
      - experimental
    paths:
      - "code/**"
      - "scraper/**"
      - "aws/**"
      - "requirements.txt"
      - ".github/workflows/upload-to-s3.yml"

jobs:
  # Fail closed: never publish a code archive that unit tests reject.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn boto3 pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests
        env:
          PYTHONPATH: code
        run: python -m pytest tests/ -q

  zip-and-upload:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create code.tar.gz
        run: |
          # Write outside the source tree. `tar -czf code.tar.gz .` otherwise
          # packs its own output and GNU tar exits 1 ("file changed as we read it").
          ARCHIVE="${RUNNER_TEMP:-/tmp}/code.tar.gz"
          tar --exclude='.git' --exclude='.github' -czf "$ARCHIVE" .
          test -s "$ARCHIVE"
          # Require the training/inference entrypoints that SageMaker expects.
          tar -tzf "$ARCHIVE" | grep -E -q '^(\./)?code/'
          mv "$ARCHIVE" code.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Set S3 key based on branch
        id: s3key
        run: |
          if [ "${{ github.ref_name }}" = "experimental" ]; then
            echo "S3_KEY=experiments/code.tar.gz" >> $GITHUB_ENV
          else
            echo "S3_KEY=code.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload to S3
        run: |
          aws s3 cp code.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/$S3_KEY
