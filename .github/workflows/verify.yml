name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - experimental

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn boto3 pytest
          # CPU torch only — enough for unit tests without the CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests
        env:
          PYTHONPATH: code
        run: python -m pytest tests/ -q
